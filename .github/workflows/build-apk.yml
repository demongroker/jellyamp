name: Build Jellyamp APK

on:
  push:
    branches: [ features/*, main ]
  pull_request:
    branches: [ features/*, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/demongroker-finamp.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=demongroker-finamp.jks
          EOF

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Determine APK filename
        id: filename
        run: |
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|features/||' | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=jellyamp-${BRANCH}-${SHORT_SHA}.apk" >> $GITHUB_OUTPUT

      - name: Determine version tag
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}

      - name: Generate SHA-256 checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum "${{ steps.filename.outputs.name }}" > "${{ steps.filename.outputs.name }}.sha256"
          cat "${{ steps.filename.outputs.name }}.sha256"

      - name: Upload APK + checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.name }}
          path: |
            build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}
            build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}.sha256
          retention-days: 30

      # Always create draft release on feature branches (agent will publish)
      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/heads/features/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jellyamp ${{ steps.version.outputs.tag }}
          draft: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}
            build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}