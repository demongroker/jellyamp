name: Build Jellyamp APK

on:
  push:
    branches: [ features/*, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ features/*, main ]
  workflow_dispatch:

# Read-only by default. Only the `release` job escalates to write, and it runs
# exclusively on tag pushes — a branch/PR build can never touch a release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.filename.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Guard #1 (tag vs pubspec). Stops the class of bug where a release is
      # tagged vX.Y.Z while pubspec still says something else — the app then
      # keeps offering the update it just installed.
      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=$TAG  pubspec=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # Static analysis gate. Errors fail the job; infos/warnings are reported
      # but not fatal until this fork's lint baseline is clean (④).
      - name: Analyze (flutter analyze)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # P0.5 regression suite (benchmark/regression_*_test.dart): auth
      # persistence, connectivity thresholds, download persistence, download
      # state machine, search filter, update checker. These are plain VM tests —
      # no emulator needed — so they run on every push/PR before the APK build.
      - name: Regression tests (benchmark/regression_*)
        run: |
          set -euo pipefail
          flutter test \
            benchmark/regression_auth_persistence_test.dart \
            benchmark/regression_connectivity_threshold_test.dart \
            benchmark/regression_download_persistence_test.dart \
            benchmark/regression_download_state_machine_test.dart \
            benchmark/regression_search_filter_test.dart \
            benchmark/regression_update_checker_test.dart \
            benchmark/regression_resumable_download_test.dart \
            benchmark/regression_library_merge_test.dart

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/demongroker-finamp.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=demongroker-finamp.jks
          EOF

      - name: Build APK (arm64)
        # NSC_HOSTS carries the owner's Jellyfin hosts; android/app/build.gradle
        # injects them into the network-security-config at build time, so no
        # private address is ever committed to this public repo (③).
        env:
          NSC_HOSTS: ${{ secrets.NSC_HOSTS }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Determine APK filename
        id: filename
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tagged release: the in-app update checker looks for
            # jellyamp-<version>.apk, so a tag build must use that name.
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "name=jellyamp-${VERSION}.apk" >> $GITHUB_OUTPUT
          else
            # Branch build: unique branch-sha name, artifact only.
            BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|features/||' | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "name=jellyamp-${BRANCH}-${SHORT_SHA}.apk" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}

      - name: Generate SHA-256 checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum "${{ steps.filename.outputs.name }}" > "${{ steps.filename.outputs.name }}.sha256"
          cat "${{ steps.filename.outputs.name }}.sha256"

      - name: Write release body
        run: |
          cd build/app/outputs/flutter-apk
          HASH=$(awk '{print $1}' "${{ steps.filename.outputs.name }}.sha256")
          {
            echo "JellyAmp ${GITHUB_REF_NAME}"
            echo ""
            # Consumed by the in-app update checker, which parses
            # 'SHA-256: <hex>' out of the release body to verify the download.
            echo "SHA-256: $HASH"
            echo ""
            echo "Asset: \`${{ steps.filename.outputs.name }}\` (+ \`.sha256\`)."
          } > release-body.md
          cat release-body.md

      - name: Upload APK + checksum + body
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.filename.outputs.name }}
          path: |
            build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}
            build/app/outputs/flutter-apk/${{ steps.filename.outputs.name }}.sha256
            build/app/outputs/flutter-apk/release-body.md
          retention-days: 30

      # Signing material must not outlive the build step, whatever happened
      # above. The runner is ephemeral, but a failed build keeps the workspace
      # around for the "re-run failed jobs" path and for artifact/debug uploads.
      - name: Remove decoded keystore and key.properties
        if: always()
        run: |
          rm -f android/app/demongroker-finamp.jks android/key.properties
          if ls android/app/*.jks android/key.properties >/dev/null 2>&1; then
            echo "::error::signing material survived the build"; exit 1
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jellyamp ${{ github.ref_name }}
          draft: false
          body_path: dist/release-body.md
          files: |
            dist/*.apk
            dist/*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guard #2 (release contract). The in-app updater is only as good as the
      # release it reads: it needs a `SHA-256:` line in the body and an asset
      # literally named jellyamp-<version>.apk. Fail the tag build if either
      # is missing instead of shipping a release the updater can't use.
      - name: Verify release contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if ! printf '%s' "$BODY" | grep -q 'SHA-256:'; then
            echo "::error::Release body has no 'SHA-256:' line"; exit 1
          fi
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for want in "jellyamp-${VERSION}.apk" "jellyamp-${VERSION}.apk.sha256"; do
            if ! printf '%s\n' "$ASSETS" | grep -qx "$want"; then
              echo "::error::Missing release asset: $want"; exit 1
            fi
          done
          echo "Release contract OK for $GITHUB_REF_NAME"
