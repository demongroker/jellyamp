name: Apply formatting + lock + codegen (CI)

# Scratch maintainer utility (one-shot). Runs under the SAME Flutter version as
# the healthcheck (3.44.9) to reformat lib/, regenerate pubspec.lock and
# regenerate Riverpod codegen, then commits the result back to the branch.
# Exists so this is produced by CI, never a local build. Removed once clean.

on:
  push:
    branches:
      - feat/1.2-redesign

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[ci-format]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Resolve dependencies (regenerate pubspec.lock)
        run: flutter pub get

      - name: Format lib/
        run: dart format lib/

      - name: Regenerate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change."
          else
            git diff --cached --stat | tail -20
            git commit -m "style: dart format lib/ + refresh pubspec.lock + regenerate codegen (Flutter 3.44.9) [ci-format]"
            git push
          fi
