version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: features/jellyamp-1.1
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
  - package-ecosystem: pub
    directory: "/"
    target-branch: features/jellyamp-1.1
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
