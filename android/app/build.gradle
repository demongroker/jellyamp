plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = 17
    }

    defaultConfig {
        // demongroker fork package — installs beside official Finamp
        applicationId "com.demongroker.jellyamp"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        // Modern phones only (Poco/arm64) — cuts APK ~110MB → ~40MB
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    signingConfigs {
        release {
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        def debugKeyStoreFile = keystoreProperties['debugKeystoreFile']
        if (debugKeyStoreFile != null) {
            debug {
                storeFile file(debugKeyStoreFile)
                storePassword keystoreProperties['debugKeystorePassword']
                keyAlias keystoreProperties['debugKeyAlias']
                keyPassword keystoreProperties['debugKeyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            resValue "string", "app_name", "Jellyamp"
            // shrinkResources false
            // minifyEnabled false
        }
        profile {
            if (signingConfigs.hasProperty('profile')) {
                signingConfig signingConfigs.profile
            }
            applicationIdSuffix '.profile'
            // minifyEnabled true // avoid dexing issues
            resValue "string", "app_name", "Jellyamp Profile"
        }
        debug {
            if (signingConfigs.hasProperty('debug')) {
                signingConfig signingConfigs.debug
            }
            applicationIdSuffix '.debug'
            // minifyEnabled true // avoid dexing issues
            resValue "string", "app_name", "Jellyamp Debug"
        }
    }
    namespace 'com.unicornsonlsd.finamp'
    lint {
        disable 'InvalidPackage'
    }
}

// ---------------------------------------------------------------------------
// Build-time Jellyfin host injection (③). The committed
// src/main/res/xml/network_security_config.xml carries loopback only; real LAN
// and Tailscale hosts arrive from the CI `NSC_HOSTS` secret or the gitignored
// android/nsc-hosts.local, are written into a generated res/ overlay for the
// build type, and are NEVER committed. No hosts configured -> template as-is.
// The host values are deliberately never logged (CI logs are public).
// ---------------------------------------------------------------------------
def nscEnv = System.getenv('NSC_HOSTS')
def nscLocalFile = rootProject.file('nsc-hosts.local')
def nscSource = 'none'
def nscHosts = []
if (nscEnv != null && !nscEnv.trim().isEmpty()) {
    nscSource = 'NSC_HOSTS env'
    nscHosts = nscEnv.split(/[,\s]+/).collect { it.trim() }
} else if (nscLocalFile.exists()) {
    nscSource = 'nsc-hosts.local'
    nscHosts = nscLocalFile.readLines().collect { it.replaceAll(/#.*$/, '').trim() }
}
nscHosts = nscHosts
    .findAll { it && it ==~ /[A-Za-z0-9.\-:_]+/ }
    .unique()
    .findAll { !(it in ['localhost', '127.0.0.1', '::1']) }

if (!nscHosts.isEmpty()) {
    def nscGenRes = "${buildDir}/generated/nsc/res"
    def nscOutFile = file("${nscGenRes}/xml/network_security_config.xml")
    def nscTemplate = file('src/main/res/xml/network_security_config.xml')
    def nscHostsForTask = nscHosts
    def nscTask = tasks.register('generateNetworkSecurityConfig') {
        inputs.property('hostCount', nscHostsForTask.size())
        // hashed, not raw: Gradle prints input values in --info/--debug logs and
        // action logs are public, so the host list must never appear there.
        inputs.property('hostsDigest', nscHostsForTask.join(',').md5())
        inputs.file(nscTemplate)
        outputs.file(nscOutFile)
        doLast {
            def anchor = '    <domain includeSubdomains="false">127.0.0.1</domain>'
            def text = nscTemplate.getText('UTF-8')
            if (!text.contains(anchor)) {
                throw new GradleException(
                    'generateNetworkSecurityConfig: cleartext anchor missing from ' +
                    'src/main/res/xml/network_security_config.xml')
            }
            def extra = nscHostsForTask.collect { h ->
                if (h.startsWith('*.')) {
                    "    <domain includeSubdomains=\"true\">${h.substring(2)}</domain>"
                } else {
                    "    <domain includeSubdomains=\"false\">${h}</domain>"
                }
            }.join('\n')
            nscOutFile.parentFile.mkdirs()
            nscOutFile.text = text.replace(anchor, anchor + '\n' + extra)
        }
    }
    // Overlay resolution: a build-type res dir outranks src/main, so the
    // generated copy replaces the template for that variant (no duplicate).
    android.sourceSets.release.res.srcDirs += nscGenRes
    android.sourceSets.debug.res.srcDirs += nscGenRes
    android.sourceSets.profile.res.srcDirs += nscGenRes
    // Every AGP task that reads the res sources must wait for the file to exist:
    // the merge, the source-set path mapping and the navigation-resource
    // processing all consume the res dirs, and Gradle 8 fails the build with an
    // implicit-dependency validation error if a generated output is read by a
    // task that does not depend on its producer.
    tasks.matching { t ->
        t.name.contains('SourceSetPaths') ||
            t.name.contains('Resources') ||
            t.name == 'preBuild'
    }.configureEach { t ->
        t.dependsOn nscTask
    }
    logger.lifecycle("JellyAmp: injecting ${nscHosts.size()} cleartext host(s) from ${nscSource}")
} else {
    logger.lifecycle('JellyAmp: no NSC hosts configured — cleartext stays loopback-only')
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
}
